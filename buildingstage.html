<!DOCTYPE html>

    <title>Tyre Inspection Dashboard</title>

    <link

    <!-- Custom CSS -->

  <body>
    <!-- HEADER -->
    <div class="header">
      <div
        class="container-fluid px-5 py-4 d-flex justify-content-between align-items-center"
      >
        <div class="d-flex align-items-center gap-3">
          <div class="logo-box">
            <i class="bi bi-arrow-repeat"></i>
          </div>
          <div>
            <h3 class="mb-0">Tyre Retreading</h3>
            <small>Quality Inspection Dashboard</small>
          </div>
        </div>

        <div class="d-flex gap-4">
          <div><i class="bi bi-person"></i> John Doe</div>
          <div><i class="bi bi-calendar"></i> <span id="today"></span></div>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <div class="container-fluid px-5">
        <a class="btn tab-btn " onclick="switchTab('visual')">
          <i class="bi bi-eye-fill"></i> Visual Inspection
        </a>
        <a
          class="btn tab-btn"
          href="nailInspection.html"
          onclick="switchTab('nail')"
        >
          <i class="bi bi-clipboard-check-fill"></i> Nail Inspection
        </a>
        <a
          class="btn tab-btn"
          href="qualityControl.html"
          onclick="switchTab('qc')"
        >
          <i class="bi bi-check-circle-fill"></i> Quality Control
        </a>
        <a
          class="btn tab-btn"
          href="shearography.html"
          onclick="switchTab('qc')"
        >
          <i class="fa-solid fa-wave-square"></i>Shearography
        </a>
        <a class="btn tab-btn" href="buffingStage.html" onclick="switchTab('qc')">
          <i class="fa-solid fa-brush"></i> Buffing Stage
        </a>
        <a class="btn tab-btn active" href="buildingstage.html" onclick="switchTab('qc')">
          <i class="fa-solid fa-building"></i> Building Stage
        </a>
        <a class="btn tab-btn" href="skiving.html" onclick="switchTab('qc')">
          <i class="fa-solid fa-scissors"></i>
          Skiving Stage
        </a>
        <a class="btn tab-btn" href="repair.html" onclick="switchTab('qc')">
          <i class="bi bi-patch-check-fill"></i> Repairs Stage
        </a>
        <a class="btn tab-btn" href="" onclick="switchTab('qc')">
          <i class="bi bi-stack"></i> Enveloping Stage
        </a>
        <a class="btn tab-btn" href="" onclick="switchTab('qc')">
          <i class="bi bi-shield-shaded"></i> Curing Stage
        </a>
        <a class="btn tab-btn" href="" onclick="switchTab('qc')">
          <i class="bi bi-arrow-up-right-square-fill"></i> Dispatch Stage
        </a>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="container-fluid px-5 py-4">
      <!-- VISUAL TAB -->
      <div id="visualTab">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input
            type="text"
            class="form-control"
            id="searchInput"
            placeholder="Search by Casing No, Serial No, or Pattern"
          />
        </div>

        <div id="builingingList"></div>
      </div>

      <!-- NAIL TAB -->
      <div id="nailTab" class="empty-tab d-none">
        <i class="bi bi-clipboard-check"></i>
        <p>No items pending nail inspection</p>
      </div>

      <!-- QC TAB -->
      <div id="qcTab" class="empty-tab d-none">
        <i class="bi bi-check-circle"></i>
        <p>No items pending quality control</p>
      </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="buildingstage.js"></script>
    <script>
      const select = document.getElementById("sectionWidth");
      const box = document.getElementById("floatBox");

      select.addEventListener("change", function () {
        if (this.value) {
          box.classList.add("has-value");
        } else {
          box.classList.remove("has-value");
        }
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchInput");

        searchInput.addEventListener("input", function () {
          const value = this.value.toLowerCase();
          const cards = document.querySelectorAll(".inspection-card");

          cards.forEach((card) => {
            const text = card.innerText.toLowerCase();

            if (text.includes(value)) {
              card.style.display = "";
            } else {
              card.style.display = "none";
            }
          });
        });
      });
    </script>
  </body>
